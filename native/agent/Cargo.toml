[package]
name = "miss-minute-agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Local-first, owner-authorized background agent for Miss Minutes"
license = "MIT"

[[bin]]
name = "miss-minute-agent"
path = "src/main.rs"

[dependencies]
anyhow = "=1.0.104"
clap = { version = "=4.6.7", features = ["derive"] }
ctrlc = { version = "=3.5.2", features = ["termination"] }
notify = "=8.2.1"
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
rusqlite = { version = "=0.41.0", features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "1.0"
fs2 = "=0.4.3"
sha2 = "=0.10.9"
zeroize = "=1.8.2"
uuid = { version = "=1.29.0", features = ["v4"] }
walkdir = "=2.5.0"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native"] }
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["linux-native-sync-persistent", "vendored", "crypto-rust"] }
