[package]
name = "miss-minute-agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Local-first, owner-authorized background agent for Miss Minutes"
license = "MIT"

[[bin]]
name = "miss-minute-agent"
path = "src/main.rs"

[dependencies]
anyhow = "=1.0.104"
clap = { version = "=4.6.7", features = ["derive"] }
ctrlc = { version = "=3.5.2", features = ["termination"] }
notify = "=8.2.1"
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
rusqlite = { version = "=0.41.0", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "=1.29.0", features = ["v4"] }
walkdir = "=2.5.0"
