[package]
name = "miss-minute-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Native desktop shell and companion runtime for Miss Minutes"
license = "MIT"

[build-dependencies]
tauri-build = "=2.7.4"

[dependencies]
anyhow = "=1.0.104"
miss-minute-agent = { path = "../../agent" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "=2.12.5", features = ["tray-icon"] }
tauri-plugin-autostart = "=2.7.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
