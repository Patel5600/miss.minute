name: Android Companion

on:
  push:
    branches:
      - feat/living-miss-minutes
    paths:
      - "native/mobile/android/**"
      - ".github/workflows/android-companion.yml"
  pull_request:
    branches:
      - main
    paths:
      - "native/mobile/android/**"
      - ".github/workflows/android-companion.yml"

permissions:
  contents: read

jobs:
  android-debug-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Android companion
        run: gradle -p native/mobile/android assembleDebug
