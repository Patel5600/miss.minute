name: Desktop Windows

on:
  push:
    branches:
      - feat/living-miss-minutes
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  windows-desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Install stable Rust
        shell: pwsh
        run: rustup toolchain install stable --profile minimal
      - name: Check Tauri desktop host
        run: cargo +stable check --manifest-path native/desktop/src-tauri/Cargo.toml
      - name: Check native agent workspace
        run: cargo +stable test --workspace --all-targets
      - name: Build release desktop executable
        run: cargo +stable build --release --manifest-path native/desktop/src-tauri/Cargo.toml
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: miss-minutes-windows-executable
          path: native/desktop/target/release/miss-minute-desktop.exe
          if-no-files-found: error
          retention-days: 14
